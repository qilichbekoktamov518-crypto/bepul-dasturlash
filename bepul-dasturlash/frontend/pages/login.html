<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Kirish | Bepul Dasturlash</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

    <main class="auth-page">

        <div class="auth-card">

            <!-- LOGO -->
            <a href="../index.html" class="auth-logo">
                Bepul Dasturlash
            </a>


            <!-- TITLE -->
            <div class="auth-heading">

                <h1>
                    Telefon raqamini kiriting
                </h1>

                <p>
                    Hisobingizga kirish uchun
                    telefon raqamingizni kiriting.
                </p>

            </div>


            <!-- FORM -->
            <form id="loginForm">

                <label for="phone">
                    Telefon raqami
                </label>

                <div class="phone-input">

                    <span>
                        +998
                    </span>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="90 123 45 67"
                        maxlength="9"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-button"
                >
                    Kod yuborish →
                </button>

            </form>


            <p class="auth-info">
                Telefon raqamingizga SMS orqali
                tasdiqlash kodi yuboriladi.
            </p>

        </div>

    </main>


    <script src="../js/login.js"></script>

</body>
</html>
